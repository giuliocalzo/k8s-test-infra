#
# compute-domain.kind.yaml with two cliques of two instead of four of one, so a
# topology-aware scheduler has two domains to keep a two-node job inside.
#
# GPU Feature Discovery later rewrites the clique labels from the mock fabric, so
# they must match local/tas/topology.yaml; both assign cliques by the worker names
# pinned below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mokka-tas
featureGates:
  DynamicResourceAllocation: true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            runtime-config: "resource.k8s.io/v1beta1=true"
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: control-0
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000ab.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-0
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000ab.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-1
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000cd.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-2
  - role: worker
    labels:
      nvidia.com/gpu.clique: "00000000-0000-0000-0000-0000000000cd.0"
      mokka.nvidia.com/type: sgpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-3
